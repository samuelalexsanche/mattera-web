name: Sitemap + IndexNow

# En cada push: avisa a Bing (que es de donde ChatGPT toma resultados) y, como
# red de seguridad, regenera el sitemap por si llegó algo sin pasar por un clon
# con los hooks instalados — por ejemplo una edición desde la web de GitHub.
#
# Lo normal es que aquí NO haya nada que commitear: el sitemap se regenera en
# el hook pre-commit (tools/hooks/pre-commit) y viaja en el mismo commit que
# las páginas. Antes se regeneraba aquí, y el commit del bot disparaba un
# segundo despliegue de Pages que cancelaba el primero: cada push dejaba una
# corrida "cancelled" y el sitio en vivo tardaba el doble en actualizarse.
#
# El commit del bot usa GITHUB_TOKEN, y GitHub NO dispara workflows con
# eventos originados por ese token, así que no se hace un bucle.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'tools/gen_sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap-e-indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gen_sitemap.py lee la fecha del último commit por archivo

      - name: Regenerar sitemap
        run: python3 tools/gen_sitemap.py

      # Si esto llega a commitear algo, es señal de que un cambio entró sin el hook.
      - name: Publicar sitemap si cambió (no debería)
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            echo "::warning::Sitemap desactualizado al llegar: ese clon no tiene el hook pre-commit. Corre tools/instalar-hooks.sh"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "sitemap: regenerado automáticamente"
            git push
            echo "sitemap actualizado y publicado"
          else
            echo "sitemap sin cambios"
          fi

      - name: Avisar a IndexNow
        env:
          # La llave viaja por entorno y se lee con os.environ.
          # Interpolarla dentro del heredoc da 422 (llega literal, sin expandir).
          INDEXNOW_KEY: ed60cc06467317361e98a88dfff914ab
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request

          key  = os.environ['INDEXNOW_KEY']
          host = 'matterasystems.com'
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          if not urls:
              raise SystemExit('sitemap sin URLs')

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps({
                  'host': host, 'key': key,
                  'keyLocation': f'https://{host}/{key}.txt',
                  'urlList': urls,
              }).encode(),
              headers={'Content-Type': 'application/json; charset=utf-8'},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f'IndexNow OK: {r.status} · {len(urls)} URLs')
          PY
