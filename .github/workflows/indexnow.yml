name: IndexNow

# Avisa a Bing (y por tanto a ChatGPT, que se apoya en su índice) cada vez
# que cambia el contenido. GitHub Pages despliega solo desde main; este
# workflow NO toca ese despliegue, únicamente manda el ping.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar URLs del sitemap a IndexNow
        env:
          # La llave viaja por entorno y se lee con os.environ.
          # Interpolarla dentro del heredoc da 422 (llave literal sin expandir).
          INDEXNOW_KEY: ed60cc06467317361e98a88dfff914ab
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request

          key = os.environ['INDEXNOW_KEY']
          host = 'matterasystems.com'

          xml = open('sitemap.xml', encoding='utf-8').read()
          urls = re.findall(r'<loc>([^<]+)</loc>', xml)
          if not urls:
              raise SystemExit('sitemap sin URLs')

          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'https://{host}/{key}.txt',
              'urlList': urls,
          }
          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json; charset=utf-8'},
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f'IndexNow OK: {r.status} · {len(urls)} URLs')
          PY
