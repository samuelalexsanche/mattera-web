name: Publicar artículo de la cola

# Los artículos ya escritos viven en _blog/pendientes/ (fuera de la web).
# Este flujo publica el siguiente cuando llega su fecha, dos veces por semana.
#
# El ritmo lo fija blog/PLAN-EDITORIAL.md: máximo dos por semana. Publicar más
# rápido no acelera el posicionamiento y sí acerca el umbral de "contenido a
# escala" de Google.
#
# Al hacer push, el flujo de sitemap + IndexNow NO se dispara solo (GitHub no
# encadena workflows lanzados con GITHUB_TOKEN), así que aquí se regenera el
# sitemap y se avisa a IndexNow en el mismo trabajo.

on:
  schedule:
    - cron: '0 15 * * 2'   # martes 15:00 UTC = 9:00 en Guadalajara
    - cron: '0 15 * * 5'   # viernes
  workflow_dispatch:        # también se puede lanzar a mano

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gen_sitemap.py lee la fecha del último commit por archivo

      - name: Publicar el siguiente de la cola
        id: publicar
        run: |
          python3 tools/publicar_pendiente.py
          if [ -n "$(git status --porcelain blog _blog)" ]; then
            echo "hubo_cambios=si" >> "$GITHUB_OUTPUT"
          else
            echo "hubo_cambios=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerar sitemap
        if: steps.publicar.outputs.hubo_cambios == 'si'
        run: python3 tools/gen_sitemap.py

      - name: Commit y push
        if: steps.publicar.outputs.hubo_cambios == 'si'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog _blog sitemap.xml
          git commit -m "blog: publica el siguiente artículo de la cola"
          git push

      - name: Avisar a IndexNow
        if: steps.publicar.outputs.hubo_cambios == 'si'
        env:
          INDEXNOW_KEY: ed60cc06467317361e98a88dfff914ab
        run: |
          python3 - <<'PY'
          import os, json, re, urllib.request
          key  = os.environ['INDEXNOW_KEY']
          host = 'matterasystems.com'
          urls = re.findall(r'<loc>([^<]+)</loc>', open('sitemap.xml', encoding='utf-8').read())
          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=json.dumps({'host': host, 'key': key,
                               'keyLocation': f'https://{host}/{key}.txt',
                               'urlList': urls}).encode(),
              headers={'Content-Type': 'application/json; charset=utf-8'})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f'IndexNow OK: {r.status} · {len(urls)} URLs')
          PY
